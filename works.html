<style>
/* ══ 브랜디크 포트폴리오 — index.html과 동일한 디자인 토큰 ══ */
:root{
  --paper:#F8F7F4;--wash:#F1EFE9;--card:#FFFFFF;--ink:#1A1F2E;--sub:#6B7280;
  --brand:#7C9082;--brand-deep:#54685B;--brand-tint:#EDF1EC;--line:#E4E2DC;--soft:#CED4BF;
  --serif:"AppleMyungjo","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --sans:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --wrap:1180px;--r:16px;
  --shadow-lift:0 2px 6px rgba(26,31,46,.06),0 18px 44px rgba(26,31,46,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.72;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;line-height:1.24;text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* 상단바 */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.top .row{max-width:var(--wrap);margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:1.24rem;font-weight:700}
.logo .mark{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;font-weight:700}
.logo small{font-family:var(--mono);font-size:.56rem;letter-spacing:.24em;color:var(--sub);font-weight:600}
.top .right{margin-left:auto;display:flex;align-items:center;gap:18px}
.top .right a{font-size:.9rem;color:var(--sub)}
.top .right a:hover{color:var(--brand-deep)}

/* 헤드 */
.head{padding:clamp(44px,6vw,74px) 0 clamp(24px,3vw,34px);text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--brand);margin-bottom:16px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.head h1{font-size:clamp(1.9rem,4.4vw,2.7rem);margin-bottom:14px}
.head p{color:var(--sub);max-width:52ch;margin:0 auto}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:clamp(30px,3.6vw,44px)}
.filt{font-size:.9rem;font-weight:600;padding:10px 20px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--sub);transition:all .2s}
.filt:hover{border-color:var(--brand);color:var(--brand-deep)}
.filt.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(124,144,130,.26)}
.filt .n{font-family:var(--mono);font-size:.74rem;opacity:.7;margin-left:5px}

/* 카드 그리드 (index.html과 동일) */
.grid-work{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
@media(max-width:980px){.grid-work{grid-template-columns:repeat(2,1fr);gap:20px}}
@media(max-width:620px){.grid-work{grid-template-columns:1fr}}
.work{display:flex;flex-direction:column;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s,border-color .28s}
button.work{cursor:pointer}
.work:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift);border-color:var(--soft)}
/* 테두리를 썸네일에 두면 aspect-ratio 계산에 1px이 섞여 카드마다 어긋날 수 있다.
   경계선은 아래 .meta 의 위쪽 테두리로 그린다. */
.work .thumb{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--brand-tint);
  line-height:0;flex:none;transform:translateZ(0)}
.work .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.work:hover .thumb img{transform:scale(1.045)}
.work .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,rgba(124,144,130,.12),rgba(206,212,191,.22)),var(--brand-tint)}
.work .ph .sym{font-family:var(--serif);font-size:2.1rem;color:var(--brand);opacity:.5}
.work .ph .lbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;color:var(--brand-deep);opacity:.75;text-transform:uppercase}
/* 흰 배경 로고가 카드에 묻히지 않도록 경계선 */
.work .meta{padding:20px 22px 24px;border-top:1px solid var(--line)}
.work .cat{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.work h3{margin:9px 0 6px;font-size:1.12rem}
.work .tags{font-size:.86rem;color:var(--sub)}

.more{margin:44px 0 0;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:.95rem;font-weight:600;
  padding:14px 28px;border-radius:999px;border:1px solid transparent;transition:all .2s}
.btn.ghost{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand-deep)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(124,144,130,.28)}
.btn.primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn .arw{transition:transform .2s}
.btn:hover .arw{transform:translateX(3px)}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:.96rem}

/* 하단 CTA */
.cta{margin-top:clamp(60px,8vw,110px);background:linear-gradient(135deg,var(--brand) 0%,var(--brand-deep) 100%);
  color:#fff;text-align:center;padding:clamp(56px,7vw,86px) 0;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 22% 18%,rgba(255,255,255,.16),transparent 55%)}
.cta .wrap{position:relative;z-index:1}
.cta h2{color:#fff;font-size:clamp(1.6rem,3.2vw,2.2rem);margin-bottom:16px}
.cta p{color:rgba(255,255,255,.86);margin-bottom:30px}
.cta .btn{background:#fff;color:var(--brand-deep)}
.cta .btn:hover{background:var(--brand-tint)}

footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;font-size:.82rem;color:var(--sub)}

/* ══ 상세 팝업 (index.html과 동일) ══ */
.wmodal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.wmodal.on{display:flex}
.wmodal .backdrop{position:absolute;inset:0;background:rgba(26,31,46,.55);backdrop-filter:blur(4px)}
.wmodal .box{position:relative;background:var(--card);border-radius:20px;overflow:hidden;
  width:min(980px,100%);max-height:min(88vh,820px);display:grid;grid-template-columns:1.15fr .85fr;
  box-shadow:0 30px 80px rgba(26,31,46,.32);animation:wpop .28s cubic-bezier(.2,.7,.3,1)}
@keyframes wpop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:760px){.wmodal{padding:12px}
  .wmodal .box{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);max-height:92vh}}
.wmodal .stage{position:relative;background:var(--paper);aspect-ratio:4/3;overflow:hidden}
/* 목업은 비율이 제각각이라 잘라내지 않고 전체가 보이게 한다 */
.wmodal .stage img{width:100%;height:100%;object-fit:contain;display:block}
.wmodal .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(26,31,46,.18);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;line-height:1}
.wmodal .nav.prev{left:14px}.wmodal .nav.next{right:14px}
.wmodal .nav:hover{background:#fff}
.wmodal .dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
.wmodal .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);transition:width .2s}
.wmodal .dots i.on{background:#fff;width:18px;border-radius:99px}
.wmodal .info{padding:clamp(24px,3vw,34px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wmodal .cat{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.wmodal h3{font-size:clamp(1.3rem,2.3vw,1.7rem);margin:9px 0 6px}
.wmodal .tags{font-size:.9rem;color:var(--sub);margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.wmodal .desc{font-size:.96rem;line-height:1.85;white-space:pre-line}
.wmodal .go{margin-top:22px}
.wmodal .close{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(26,31,46,.18);
  display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--ink)}
.wmodal .close:hover{background:#fff}
body.locked{overflow:hidden}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<body>

<header class="top">
  <div class="row">
    <a class="logo" href="index.html"><span class="mark">B</span><span>브랜디크 <small>BRANDIQUE</small></span></a>
    <div class="right">
      <a href="index.html#price">가격 안내</a>
      <a href="survey.html">무료 상담 신청</a>
      <a href="index.html">← 홈으로</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="head">
    <span class="eyebrow">Portfolio</span>
    <h1>브랜디크가 설계한 브랜드</h1>
    <p>각 브랜드가 가진 이야기를 읽고, 그에 맞는 톤앤매너를 설계합니다. 카드를 누르면 자세히 보실 수 있습니다.</p>
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid-work" id="workGrid" data-workgrid></div>
  <div class="more" id="more" hidden>
    <button class="btn ghost" type="button" id="moreBtn">더 보기</button>
  </div>
</div>

<section class="cta">
  <div class="wrap">
    <h2>다음 브랜드는 당신의 브랜드입니다</h2>
    <p>브랜드 설문을 작성하시면 방향과 견적을 정리해 답변드립니다.</p>
    <a class="btn" href="survey.html">무료 상담 신청 <span class="arw">→</span></a>
  </div>
</section>

<!-- 상세 팝업 -->
<div class="wmodal" id="wmodal" role="dialog" aria-modal="true" aria-labelledby="wmTitle">
  <div class="backdrop" data-close></div>
  <div class="box">
    <button class="close" type="button" data-close aria-label="닫기">✕</button>
    <div class="stage">
      <img id="wmImg" src="" alt="">
      <button class="nav prev" type="button" id="wmPrev" aria-label="이전 이미지">‹</button>
      <button class="nav next" type="button" id="wmNext" aria-label="다음 이미지">›</button>
      <div class="dots" id="wmDots"></div>
    </div>
    <div class="info">
      <span class="cat" id="wmCat"></span>
      <h3 id="wmTitle"></h3>
      <p class="tags" id="wmTags"></p>
      <p class="desc" id="wmDesc"></p>
      <a class="btn ghost go" id="wmLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<footer><div class="wrap">브랜디크 · contact@brandique.co.kr · 서울 강남구 신사동</div></footer>

<script src="works-data.js"></script>
<script src="works.js"></script>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const PAGE = 12;              // 한 번에 보여줄 개수
let filter = '전체', shown = PAGE;

/* 실제로 작업물이 있는 유형만 필터로 만든다 */
function buildFilters(){
  const counts = {};
  BQ.WORKS.forEach(w => { const t = w.type || '기타'; counts[t] = (counts[t]||0)+1; });
  const types = BQ.WORK_TYPES.filter(t => counts[t]);
  Object.keys(counts).forEach(t => { if(!types.includes(t)) types.push(t); });   // 목록에 없는 유형도 살림
  if(!BQ.WORKS.length){ $('#filters').style.display='none'; return; }
  $('#filters').innerHTML =
    [['전체', BQ.WORKS.length], ...types.map(t=>[t,counts[t]])]
      .map(([t,n])=>`<button class="filt${t===filter?' on':''}" type="button" data-t="${BQ.esc(t)}">${BQ.esc(t)}<span class="n">${n}</span></button>`)
      .join('');
}

function visible(){
  return filter==='전체' ? BQ.WORKS : BQ.WORKS.filter(w => (w.type||'기타')===filter);
}

function draw(){
  const all = visible();
  BQ.renderGrid($('#workGrid'), all.slice(0, shown), 9);
  $('#more').hidden = all.length <= shown;
  $('#moreBtn').textContent = `더 보기 (${Math.min(shown, all.length)} / ${all.length})`;
}

$('#filters').addEventListener('click', e=>{
  const b = e.target.closest('.filt'); if(!b) return;
  filter = b.dataset.t; shown = PAGE;
  document.querySelectorAll('.filt').forEach(x=>x.classList.toggle('on', x===b));
  draw();
  window.scrollTo({top:0, behavior:'smooth'});
});
$('#moreBtn').addEventListener('click', ()=>{ shown += PAGE; draw(); });

buildFilters();
draw();
BQ.initModal();
</script>
</body>
